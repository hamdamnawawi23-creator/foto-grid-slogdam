<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Dokumentasi - Slogdam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #cbd5e1;
            --bg-color: #f1f5f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .sidebar {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input[type="text"], .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input[type="file"] {
            font-size: 12px;
            width: 100%;
        }
        .slider {
            width: 100%;
        }
        .font-size-val {
            color: #0284c7;
            font-weight: bold;
        }
        
        /* Kertas Laporan */
        .report-paper {
            width: 800px; /* Ukuran standar landscape */
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            padding-bottom: 20px;
        }
        
        /* Header Kop */
        .header {
            position: relative;
            width: 100%;
            height: 160px; /* Tinggi proporsional */
            background: linear-gradient(to bottom, #d32f2f 50%, #ffffff 50%);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid #f8fafc;
        }
        
        .header-title-container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60%;
        }

        /* Gaya Teks Kuning Border Hitam (Standar Militer) */
        .text-military {
            color: #FFD700;
            font-weight: 900;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            /* Border luar (stroke) hitam tebal & bayangan */
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px  3px 5px rgba(0,0,0,0.8);
        }
        
        /* Baris 1 Wajib 1 Baris */
        #previewJudul1 {
            white-space: nowrap; 
            font-size: 32px; /* Default */
            margin-bottom: 5px;
        }
        #previewJudul2 {
            font-size: 26px; /* Default */
        }

        /* Logo Position */
        .logo-kiri {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            height: 110px;
            z-index: 10;
        }
        .logo-kanan {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            height: 110px;
            z-index: 10;
        }

        /* Tanggal di Kanan Bawah Header */
        .date-container {
            position: absolute;
            right: 25px;
            bottom: 5px;
            z-index: 10;
        }
        #previewTanggal {
            font-size: 14px; /* Default */
            text-transform: none;
            letter-spacing: 0px;
        }

        /* Grid Foto */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 Kolom */
            gap: 15px;
            padding: 20px;
        }
        .photo-box {
            background-color: #334155;
            width: 100%;
            aspect-ratio: 4/3;
            background-size: cover;
            background-position: center;
            border: 3px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-weight: bold;
        }

        .btn-download {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3);
        }
        .btn-download:hover { background: #15803d; }
    </style>
</head>
<body>

    <!-- Panel Pengaturan -->
    <div class="sidebar">
        <h2 style="margin-top: 0; font-size: 18px; color: var(--primary);">⚙️ Pengaturan Laporan</h2>
        
        <div class="form-group">
            <label>Judul Baris 1</label>
            <input type="text" id="inputJudul1" value="DOKUMENTASI PEMBERSIHAN">
        </div>
        <div class="form-group">
            <label>Ukuran Font Judul 1: <span id="valSize1" class="font-size-val">32</span>px</label>
            <input type="range" id="sizeJudul1" class="slider" min="16" max="60" value="32">
        </div>

        <div class="form-group">
            <label>Judul Baris 2</label>
            <input type="text" id="inputJudul2" value="SEKTOR SLOGDAM XII/TPR">
        </div>
        <div class="form-group">
            <label>Ukuran Font Judul 2: <span id="valSize2" class="font-size-val">26</span>px</label>
            <input type="range" id="sizeJudul2" class="slider" min="14" max="50" value="26">
        </div>

        <div class="form-group">
            <label>Tanggal & Hari</label>
            <input type="text" id="inputTanggal" value="Sabtu, 7 November 2026">
        </div>
        <div class="form-group">
            <label>Ukuran Font Tanggal: <span id="valSizeTgl" class="font-size-val">14</span>px</label>
            <input type="range" id="sizeTanggal" class="slider" min="10" max="30" value="14">
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <div class="form-group">
            <label>Background Kop (Opsional)</label>
            <input type="file" id="inputBg" accept="image/*">
            <small style="color: gray;">(Upload gambar Satin Merah Putih di sini)</small>
        </div>
        <div class="form-group">
            <label>Logo Instansi Kiri</label>
            <input type="file" id="inputLogoKiri" accept="image/*">
        </div>
        <div class="form-group">
            <label>Logo Instansi Kanan (Opsional)</label>
            <input type="file" id="inputLogoKanan" accept="image/*">
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <div class="form-group">
            <label>Upload Foto 1 (Kiri Atas)</label>
            <input type="file" id="inputFoto1" accept="image/*">
        </div>
        <div class="form-group">
            <label>Upload Foto 2 (Kanan Atas)</label>
            <input type="file" id="inputFoto2" accept="image/*">
        </div>
        <div class="form-group">
            <label>Upload Foto 3 (Kiri Bawah)</label>
            <input type="file" id="inputFoto3" accept="image/*">
        </div>
        <div class="form-group">
            <label>Upload Foto 4 (Kanan Bawah)</label>
            <input type="file" id="inputFoto4" accept="image/*">
        </div>
    </div>

    <!-- Area Pratinjau Kertas -->
    <div class="main-content">
        <button class="btn-download" onclick="downloadReport()">📥 Unduh Laporan (JPG)</button>
        
        <div class="report-paper" id="reportArea">
            <!-- Header (Merah Putih) -->
            <div class="header" id="headerContainer">
                <img id="logoKiriPreview" class="logo-kiri" style="display: none;">
                
                <div class="header-title-container">
                    <div id="previewJudul1" class="text-military">DOKUMENTASI PEMBERSIHAN</div>
                    <div id="previewJudul2" class="text-military">SEKTOR SLOGDAM XII/TPR</div>
                </div>

                <img id="logoKananPreview" class="logo-kanan" style="display: none;">
                
                <!-- Tanggal -->
                <div class="date-container">
                    <div id="previewTanggal" class="text-military">Sabtu, 7 November 2026</div>
                </div>
            </div>

            <!-- Grid Foto -->
            <div class="grid-container">
                <div class="photo-box" id="boxFoto1">Foto 1</div>
                <div class="photo-box" id="boxFoto2">Foto 2</div>
                <div class="photo-box" id="boxFoto3">Foto 3</div>
                <div class="photo-box" id="boxFoto4">Foto 4</div>
            </div>
        </div>
    </div>

    <script>
        // Real-time Text Update
        document.getElementById('inputJudul1').addEventListener('input', e => document.getElementById('previewJudul1').innerText = e.target.value);
        document.getElementById('inputJudul2').addEventListener('input', e => document.getElementById('previewJudul2').innerText = e.target.value);
        document.getElementById('inputTanggal').addEventListener('input', e => document.getElementById('previewTanggal').innerText = e.target.value);

        // Real-time Font Size Adjustments
        document.getElementById('sizeJudul1').addEventListener('input', e => {
            document.getElementById('previewJudul1').style.fontSize = e.target.value + 'px';
            document.getElementById('valSize1').innerText = e.target.value;
        });
        document.getElementById('sizeJudul2').addEventListener('input', e => {
            document.getElementById('previewJudul2').style.fontSize = e.target.value + 'px';
            document.getElementById('valSize2').innerText = e.target.value;
        });
        document.getElementById('sizeTanggal').addEventListener('input', e => {
            document.getElementById('previewTanggal').style.fontSize = e.target.value + 'px';
            document.getElementById('valSizeTgl').innerText = e.target.value;
        });

        // Image Upload Handlers
        function handleImageUpload(inputId, targetId, isBackground = false) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const targetElement = document.getElementById(targetId);
                        if (isBackground) {
                            targetElement.style.backgroundImage = `url(${event.target.result})`;
                            // Hapus gradien merah putih bawaan jika gambar dimasukkan
                            targetElement.style.background = `url(${event.target.result})`;
                            targetElement.style.backgroundSize = 'cover';
                            targetElement.style.backgroundPosition = 'center';
                        } else if (targetElement.tagName === 'IMG') {
                            targetElement.src = event.target.result;
                            targetElement.style.display = 'block';
                        } else {
                            targetElement.style.backgroundImage = `url(${event.target.result})`;
                            targetElement.innerText = ''; // Hilangkan teks placeholder
                        }
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        // Setup Event Listeners for Images
        handleImageUpload('inputBg', 'headerContainer', true);
        handleImageUpload('inputLogoKiri', 'logoKiriPreview');
        handleImageUpload('inputLogoKanan', 'logoKananPreview');
        handleImageUpload('inputFoto1', 'boxFoto1');
        handleImageUpload('inputFoto2', 'boxFoto2');
        handleImageUpload('inputFoto3', 'boxFoto3');
        handleImageUpload('inputFoto4', 'boxFoto4');

        // Download Function
        function downloadReport() {
            const reportArea = document.getElementById('reportArea');
            html2canvas(reportArea, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Laporan-Dokumentasi.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }
    </script>
</body>
</html>
