<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Dokumentasi - Slogdam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #cbd5e1;
            --bg-color: #f1f5f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .sidebar {
            width: 380px; 
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: 90vh; 
            overflow-y: auto; 
            box-sizing: border-box;
        }
        
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            height: 90vh;
        }
        .form-group {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #334155;
        }
        .form-group input[type="text"], .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            text-align: left;
        }

        .form-group input[type="file"] {
            font-size: 12px;
            width: 100%;
        }
        .slider {
            width: 100%;
            margin-top: 5px;
        }
        .val-display {
            color: #2563eb;
            font-weight: bold;
        }
        
        /* Kertas Laporan */
        .report-paper {
            width: 800px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            padding-bottom: 20px;
            box-sizing: border-box; 
            flex-shrink: 0;
        }
        
        /* Header Kop */
        .header {
            position: relative;
            width: 100%;
            height: 160px;
            background: linear-gradient(to bottom, #d32f2f 50%, #ffffff 50%);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid #f8fafc;
        }
        
        .header-title-container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70%;
        }

        /* Teks Judul - SHADOW DIHILANGKAN, MURNI STROKE HITAM */
        .text-military {
            color: #FFD700;
            font-weight: 900;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            -webkit-text-stroke: 1.5px black;
            text-shadow: none; /* Dihapus total agar bersih */
            white-space: pre-wrap; 
            line-height: 1.2; 
        }
        
        #previewJudul1 {
            font-size: 32px; 
            margin-bottom: 5px;
        }
        #previewJudul2 {
            font-size: 26px; 
        }

        /* Logo */
        .logo-kiri {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 110px;
            z-index: 10;
            max-width: 110px;
            object-fit: contain;
        }
        .logo-kanan {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 110px;
            z-index: 10;
            max-width: 110px;
            object-fit: contain;
        }

        /* Tanggal */
        .date-container {
            position: absolute;
            right: 25px;
            bottom: 5px;
            z-index: 10;
        }
        #previewTanggal {
            font-size: 14px; 
            text-transform: none;
            letter-spacing: 0px;
            -webkit-text-stroke: 1px black;
            text-shadow: none; /* Dihapus total agar bersih */
        }

        /* Grid Foto */
        .grid-container {
            display: grid;
            gap: 15px;
            padding: 20px;
            grid-template-columns: 1fr 1fr; 
            width: 100%;
            box-sizing: border-box; 
        }
        
        .photo-box {
            background-color: #334155;
            width: 100%;
            aspect-ratio: 4/3; 
            background-size: cover;
            background-position: center;
            border: 4px solid #000000; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Container Upload */
        #dynamicUploadContainer {
            border: 1px dashed #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .dynamic-photo-input {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .dynamic-photo-input:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .btn-download {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3);
            width: 100%;
            max-width: 800px;
        }
        .btn-download:hover { background: #15803d; }

        /* TAMPILAN RESPONSIF UNTUK HP / MOBILE */
        @media (max-width: 850px) {
            body {
                flex-direction: column; 
                padding: 10px;
            }
            .sidebar {
                width: 100%; 
                height: auto; 
                max-height: none;
                overflow-y: visible;
                margin-bottom: 20px;
            }
            .main-content {
                width: 100%;
                height: auto;
                overflow-x: auto; 
                align-items: flex-start; 
            }
            .main-content::before {
                content: "Geser ke kanan untuk melihat pratinjau penuh ➡️";
                display: block;
                color: #64748b;
                font-size: 12px;
                font-weight: bold;
                margin-bottom: 10px;
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="margin-top: 0; font-size: 18px; color: var(--primary); text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">⚙️ Pengaturan Laporan</h2>
        
        <h3 style="font-size: 14px; color: #64748b; margin-top: 20px;">1. PENGATURAN TEKS KOP</h3>
        
        <div class="form-group">
            <label>Pilih Jenis Font (Untuk Semua Teks)</label>
            <select id="fontFamilySelector">
                <option value="Arial, sans-serif" selected>Arial (Standar Militer)</option>
                <option value="'Impact', sans-serif">Impact (Tebal & Padat)</option>
                <option value="'Times New Roman', serif">Times New Roman (Formal)</option>
                <option value="'Tahoma', sans-serif">Tahoma (Jelas & Modern)</option>
                <option value="'Courier New', monospace">Courier New (Mesin Tik)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Judul Baris 1 (Gunakan Enter jika kepanjangan)</label>
            <textarea id="inputJudul1">DOKUMENTASI KEGIATAN PEMBERSIHAN</textarea>
            <label style="margin-top: 10px;">Ukuran Font: <span id="valSize1" class="val-display">25</span>px</label>
            <input type="range" id="sizeJudul1" class="slider" min="16" max="60" value="25">
            
            <label style="margin-top: 10px;">Tebal Garis Tepi (Stroke): <span id="valStroke1" class="val-display">1.5</span>px</label>
            <input type="range" id="strokeJudul1" class="slider" min="0" max="4" step="0.1" value="1.5">
        </div>

        <div class="form-group">
            <label>Judul Baris 2 (Gunakan Enter jika kepanjangan)</label>
            <textarea id="inputJudul2">SEKTOR SLOGDAM XII/TPR</textarea>
            <label style="margin-top: 10px;">Ukuran Font: <span id="valSize2" class="val-display">22</span>px</label>
            <input type="range" id="sizeJudul2" class="slider" min="14" max="50" value="22">
        </div>

        <div class="form-group">
            <label>Keterangan Tanggal & Hari</label>
            <input type="text" id="inputTanggal" value="Sabtu, 7 November 2026">
            <label style="margin-top: 10px;">Ukuran Font: <span id="valSizeTgl" class="val-display">14</span>px</label>
            <input type="range" id="sizeTanggal" class="slider" min="10" max="30" value="14">
            
            <label style="margin-top: 10px;">Tebal Garis Tepi (Stroke): <span id="valStrokeTgl" class="val-display">1</span>px</label>
            <input type="range" id="strokeTanggal" class="slider" min="0" max="3" step="0.1" value="1">
        </div>

        <h3 style="font-size: 14px; color: #64748b; margin-top: 25px;">2. BACKGROUND & LOGO</h3>
        <div class="form-group">
            <label>Background Kop (Opsional)</label>
            <input type="file" id="inputBg" accept="image/*">
            <small style="color: gray; display:block; margin-top:4px;">(Upload Satin Merah Putih di sini)</small>
        </div>
        
        <div class="form-group">
            <label>Logo Instansi Kiri</label>
            <input type="file" id="inputLogoKiri" accept="image/*">
        </div>
        
        <div class="form-group">
            <label>Logo Instansi Kanan (Opsional)</label>
            <input type="file" id="inputLogoKanan" accept="image/*">
        </div>

        <h3 style="font-size: 14px; color: #64748b; margin-top: 25px;">3. LAYOUT & JUMLAH FOTO</h3>
        <div class="form-group">
            <label>Pilih Jumlah Foto / Grid</label>
            <select id="gridSelector" onchange="generateGrid()">
                <option value="1">1 Foto (Penuh)</option>
                <option value="2">2 Foto (Berdampingan)</option>
                <option value="3">3 Foto (1 Atas, 2 Bawah)</option>
                <option value="4">4 Foto (Grid 2x2 - Standar)</option>
                <option value="6" selected>6 Foto (Grid 2 Kolom x 3 Baris)</option>
                <option value="8">8 Foto (Grid 2 Kolom x 4 Baris)</option>
            </select>
        </div>

        <div id="dynamicUploadContainer">
        </div>
    </div>

    <div class="main-content">
        <button class="btn-download" onclick="downloadReport()">📥 Unduh Laporan (JPG Resolusi Tinggi)</button>
        
        <div class="report-paper" id="reportArea">
            <div class="header" id="headerContainer">
                <img id="logoKiriPreview" class="logo-kiri" style="display: none;">
                
                <div class="header-title-container">
                    <div id="previewJudul1" class="text-military">DOKUMENTASI KEGIATAN PEMBERSIHAN</div>
                    <div id="previewJudul2" class="text-military">SEKTOR SLOGDAM XII/TPR</div>
                </div>

                <img id="logoKananPreview" class="logo-kanan" style="display: none;">
                
                <div class="date-container">
                    <div id="previewTanggal" class="text-military">Sabtu, 7 November 2026</div>
                </div>
            </div>

            <div class="grid-container" id="gridContainerPreview">
            </div>
        </div>
    </div>

    <script>
        document.getElementById('inputJudul1').addEventListener('input', e => document.getElementById('previewJudul1').innerText = e.target.value);
        document.getElementById('inputJudul2').addEventListener('input', e => document.getElementById('previewJudul2').innerText = e.target.value);
        document.getElementById('inputTanggal').addEventListener('input', e => document.getElementById('previewTanggal').innerText = e.target.value);

        document.getElementById('fontFamilySelector').addEventListener('change', e => {
            const selectedFont = e.target.value;
            document.getElementById('previewJudul1').style.fontFamily = selectedFont;
            document.getElementById('previewJudul2').style.fontFamily = selectedFont;
            document.getElementById('previewTanggal').style.fontFamily = selectedFont;
        });

        document.getElementById('sizeJudul1').addEventListener('input', e => {
            document.getElementById('previewJudul1').style.fontSize = e.target.value + 'px';
            document.getElementById('valSize1').innerText = e.target.value;
        });
        document.getElementById('sizeJudul2').addEventListener('input', e => {
            document.getElementById('previewJudul2').style.fontSize = e.target.value + 'px';
            document.getElementById('valSize2').innerText = e.target.value;
        });
        document.getElementById('sizeTanggal').addEventListener('input', e => {
            document.getElementById('previewTanggal').style.fontSize = e.target.value + 'px';
            document.getElementById('valSizeTgl').innerText = e.target.value;
        });

        document.getElementById('strokeJudul1').addEventListener('input', e => {
            const strokeVal = e.target.value + 'px black';
            document.getElementById('previewJudul1').style.webkitTextStroke = strokeVal;
            document.getElementById('previewJudul2').style.webkitTextStroke = strokeVal;
            document.getElementById('valStroke1').innerText = e.target.value;
        });
        
        document.getElementById('strokeTanggal').addEventListener('input', e => {
            document.getElementById('previewTanggal').style.webkitTextStroke = e.target.value + 'px black';
            document.getElementById('valStrokeTgl').innerText = e.target.value;
        });

        function handleHeaderUpload(inputId, targetId, isBackground = false) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const targetElement = document.getElementById(targetId);
                        if (isBackground) {
                            targetElement.style.background = `url(${event.target.result})`;
                            targetElement.style.backgroundSize = 'cover';
                            targetElement.style.backgroundPosition = 'center';
                        } else {
                            targetElement.src = event.target.result;
                            targetElement.style.display = 'block';
                        }
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        handleHeaderUpload('inputBg', 'headerContainer', true);
        handleHeaderUpload('inputLogoKiri', 'logoKiriPreview');
        handleHeaderUpload('inputLogoKanan', 'logoKananPreview');

        function generateGrid() {
            const count = parseInt(document.getElementById('gridSelector').value);
            const uploadContainer = document.getElementById('dynamicUploadContainer');
            const gridPreview = document.getElementById('gridContainerPreview');
            
            uploadContainer.innerHTML = '';
            gridPreview.innerHTML = '';

            if (count === 1) {
                gridPreview.style.gridTemplateColumns = '1fr';
            } else if (count === 2 || count === 4 || count === 6 || count === 8) {
                gridPreview.style.gridTemplateColumns = '1fr 1fr'; 
            } else if (count === 3) {
                gridPreview.style.gridTemplateColumns = '1fr 1fr'; 
            }

            for (let i = 1; i <= count; i++) {
                const uploadDiv = document.createElement('div');
                uploadDiv.className = 'dynamic-photo-input form-group';
                uploadDiv.style.background = 'transparent';
                uploadDiv.style.border = 'none';
                uploadDiv.style.padding = '0';
                
                const label = document.createElement('label');
                label.innerText = `Ganti Foto #${i}`;
                
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.id = `inputFoto${i}`;
                
                uploadDiv.appendChild(label);
                uploadDiv.appendChild(input);
                uploadContainer.appendChild(uploadDiv);

                const photoBox = document.createElement('div');
                photoBox.className = 'photo-box';
                photoBox.id = `boxFoto${i}`;
                photoBox.innerText = `Foto Kegiatan ${i}`;
                
                if (count === 3 && i === 1) {
                    photoBox.style.gridColumn = '1 / span 2'; 
                    photoBox.style.aspectRatio = '21/9'; 
                }

                gridPreview.appendChild(photoBox);

                input.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            const targetBox = document.getElementById(`boxFoto${i}`);
                            targetBox.style.backgroundImage = `url(${event.target.result})`;
                            targetBox.innerText = ''; 
                        }
                        reader.readAsDataURL(file);
                    }
                });
            }
        }

        generateGrid();

        function downloadReport() {
            const reportArea = document.getElementById('reportArea');
            html2canvas(reportArea, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Dokumentasi-Slogdam-Grid.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }
    </script>
</body>
</html>
