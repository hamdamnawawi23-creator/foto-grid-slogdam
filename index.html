<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Laporan Dokumentasi - Slogdam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #cbd5e1;
            --bg-color: #f1f5f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .sidebar {
            width: 390px; 
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: 90vh; 
            overflow-y: auto; 
            box-sizing: border-box;
        }
        
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            height: 90vh;
        }
        .form-group {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: #334155;
        }
        .form-group input[type="text"], .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 55px;
            text-align: left;
        }

        .form-group input[type="file"] {
            font-size: 12px;
            width: 100%;
        }
        .slider {
            width: 100%;
            margin: 4px 0 8px 0;
            cursor: pointer;
        }
        .val-display {
            color: #2563eb;
            font-weight: bold;
        }
        
        /* Kertas Laporan */
        .report-paper {
            width: 800px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            padding-bottom: 20px;
            box-sizing: border-box; 
            flex-shrink: 0;
        }
        
        /* Header Kop */
        .header {
            position: relative;
            width: 100%;
            height: 160px;
            background: linear-gradient(to bottom, #d32f2f 50%, #ffffff 50%);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid #f8fafc;
            overflow: hidden;
        }
        
        .header-title-container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70%;
        }

        /* Teks Judul - Shadow 8 Arah Mulus */
        .text-military {
            color: #FFD700;
            font-weight: 900;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            -webkit-text-stroke: 0px; 
            text-shadow: 
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                -2px  0px 0 #000,
                 2px  0px 0 #000,
                 0px  2px 0 #000,
                 0px -2px 0 #000;
            white-space: pre-wrap; 
            line-height: 1.2; 
        }
        
        #previewJudul1 {
            font-size: 25px; 
            margin-bottom: 5px;
        }
        #previewJudul2 {
            font-size: 22px; 
        }

        /* Logo */
        .logo-kiri {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 110px;
            z-index: 10;
            max-width: 110px;
            object-fit: contain;
        }
        .logo-kanan {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 110px;
            z-index: 10;
            max-width: 110px;
            object-fit: contain;
        }

        /* Tanggal */
        .date-container {
            position: absolute;
            right: 25px;
            bottom: 5px;
            z-index: 10;
        }
        
        #previewTanggal {
            font-size: 14px; 
            text-transform: none;
            letter-spacing: 0px;
            -webkit-text-stroke: 0px;
            text-shadow: 
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                -1px  0px 0 #000,
                 1px  0px 0 #000,
                 0px  1px 0 #000,
                 0px -1px 0 #000;
        }

        /* Grid Foto */
        .grid-container {
            display: grid;
            gap: 15px;
            padding: 20px;
            grid-template-columns: 1fr 1fr; 
            width: 100%;
            box-sizing: border-box; 
        }
        
        /* Kotak Pembungkus Foto menggunakan Tag IMG Asli agar Akurat saat Diunduh */
        .photo-box {
            background-color: #334155;
            width: 100%;
            aspect-ratio: 4/3; 
            border: 4px solid #000000; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 50%;
            display: none;
        }

        .photo-placeholder {
            position: absolute;
            pointer-events: none;
        }

        /* Container Upload */
        #dynamicUploadContainer {
            border: 1px dashed #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }
        .dynamic-photo-input {
            margin-bottom: 12px;
            padding: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
        .dynamic-photo-input:last-child {
            margin-bottom: 0;
        }

        .control-row {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .control-col {
            flex: 1;
        }
        .sub-label {
            font-size: 11px !important;
            color: #475569 !important;
            margin-bottom: 2px !important;
            font-weight: 600 !important;
        }

        .btn-download {
            background: #16a34a;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3);
            width: 100%;
            max-width: 800px;
        }
        .btn-download:hover { background: #15803d; }
        .btn-download:disabled { background: #94a3b8; cursor: not-allowed; }

        /* RESPONSIF HP */
        @media (max-width: 850px) {
            body {
                flex-direction: column; 
                padding: 10px;
            }
            .sidebar {
                width: 100%; 
                height: auto; 
                max-height: none;
                overflow-y: visible;
                margin-bottom: 10px;
            }
            .main-content {
                width: 100%;
                height: auto;
                overflow-x: auto; 
                align-items: flex-start; 
            }
            .main-content::before {
                content: "Geser ke kanan untuk memeriksa pratinjau penuh ➡️";
                display: block;
                color: #64748b;
                font-size: 12px;
                font-weight: bold;
                margin-bottom: 10px;
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="margin-top: 0; font-size: 18px; color: var(--primary); text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">⚙️ Pengaturan Laporan</h2>
        
        <h3 style="font-size: 14px; color: #64748b; margin-top: 20px;">1. PENGATURAN TEKS KOP</h3>
        
        <div class="form-group">
            <label>Pilih Jenis Font</label>
            <select id="fontFamilySelector">
                <option value="Arial, sans-serif" selected>Arial (Standar Militer)</option>
                <option value="'Impact', sans-serif">Impact (Tebal & Padat)</option>
                <option value="'Times New Roman', serif">Times New Roman (Formal)</option>
                <option value="'Tahoma', sans-serif">Tahoma (Jelas & Modern)</option>
                <option value="'Courier New', monospace">Courier New (Mesin Tik)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Judul Baris 1 (Gunakan Enter jika kepanjangan)</label>
            <textarea id="inputJudul1">DOKUMENTASI
KEGIATAN PEMBERSIHAN SEKTOR</textarea>
            <label style="margin-top: 8px;">Ukuran Font: <span id="valSize1" class="val-display">25</span>px</label>
            <input type="range" id="sizeJudul1" class="slider" min="16" max="60" value="25">
        </div>

        <div class="form-group">
            <label>Judul Baris 2 (Gunakan Enter jika kepanjangan)</label>
            <textarea id="inputJudul2">SLOGDAM XII/TPR</textarea>
            <label style="margin-top: 8px;">Ukuran Font: <span id="valSize2" class="val-display">22</span>px</label>
            <input type="range" id="sizeJudul2" class="slider" min="14" max="50" value="22">
        </div>

        <div class="form-group">
            <label>Keterangan Tanggal & Hari</label>
            <input type="text" id="inputTanggal" value="Rabu, 18 November 2026">
            <label style="margin-top: 8px;">Ukuran Font: <span id="valSizeTgl" class="val-display">14</span>px</label>
            <input type="range" id="sizeTanggal" class="slider" min="10" max="30" value="14">
        </div>

        <h3 style="font-size: 14px; color: #64748b; margin-top: 25px;">2. BACKGROUND & LOGO</h3>
        <div class="form-group">
            <label>Background Kop (Opsional)</label>
            <input type="file" id="inputBg" accept="image/*">
        </div>
        <div class="form-group">
            <label>Logo Instansi Kiri</label>
            <input type="file" id="inputLogoKiri" accept="image/*">
        </div>
        <div class="form-group">
            <label>Logo Instansi Kanan (Opsional)</label>
            <input type="file" id="inputLogoKanan" accept="image/*">
        </div>

        <h3 style="font-size: 14px; color: #64748b; margin-top: 25px;">3. LAYOUT & PENGATURAN FOTO</h3>
        <div class="form-group">
            <label>Pilih Jumlah Foto / Grid</label>
            <select id="gridSelector" onchange="generateGrid()">
                <option value="1">1 Foto (Penuh)</option>
                <option value="2">2 Foto (Berdampingan)</option>
                <option value="3">3 Foto (1 Atas, 2 Bawah)</option>
                <option value="4">4 Foto (Grid 2x2 - Standar)</option>
                <option value="6" selected>6 Foto (Grid 2 Kolom x 3 Baris)</option>
                <option value="8">8 Foto (Grid 2 Kolom x 4 Baris)</option>
            </select>
        </div>

        <div id="dynamicUploadContainer"></div>
    </div>

    <div class="main-content">
        <button class="btn-download" id="btnDownload" onclick="downloadReport()">📥 Unduh Laporan (JPG Resolusi Tinggi)</button>
        
        <div class="report-paper" id="reportArea">
            <div class="header" id="headerContainer">
                <img id="logoKiriPreview" class="logo-kiri" style="display: none;">
                
                <div class="header-title-container">
                    <div id="previewJudul1" class="text-military">DOKUMENTASI
KEGIATAN PEMBERSIHAN SEKTOR</div>
                    <div id="previewJudul2" class="text-military">SLOGDAM XII/TPR</div>
                </div>

                <img id="logoKananPreview" class="logo-kanan" style="display: none;">
                
                <div class="date-container">
                    <div id="previewTanggal" class="text-military">Rabu, 18 November 2026</div>
                </div>
            </div>

            <div class="grid-container" id="gridContainerPreview"></div>
        </div>
    </div>

    <script>
        // Simpan memori foto agar tidak hilang saat ganti jumlah grid
        const photoState = {};

        // Update Teks Real-Time
        document.getElementById('inputJudul1').addEventListener('input', e => document.getElementById('previewJudul1').innerText = e.target.value);
        document.getElementById('inputJudul2').addEventListener('input', e => document.getElementById('previewJudul2').innerText = e.target.value);
        document.getElementById('inputTanggal').addEventListener('input', e => document.getElementById('previewTanggal').innerText = e.target.value);

        document.getElementById('fontFamilySelector').addEventListener('change', e => {
            const selectedFont = e.target.value;
            document.getElementById('previewJudul1').style.fontFamily = selectedFont;
            document.getElementById('previewJudul2').style.fontFamily = selectedFont;
            document.getElementById('previewTanggal').style.fontFamily = selectedFont;
        });

        document.getElementById('sizeJudul1').addEventListener('input', e => {
            document.getElementById('previewJudul1').style.fontSize = e.target.value + 'px';
            document.getElementById('valSize1').innerText = e.target.value;
        });
        document.getElementById('sizeJudul2').addEventListener('input', e => {
            document.getElementById('previewJudul2').style.fontSize = e.target.value + 'px';
            document.getElementById('valSize2').innerText = e.target.value;
        });
        document.getElementById('sizeTanggal').addEventListener('input', e => {
            document.getElementById('previewTanggal').style.fontSize = e.target.value + 'px';
            document.getElementById('valSizeTgl').innerText = e.target.value;
        });

        function handleHeaderUpload(inputId, targetId, isBackground = false) {
            document.getElementById(inputId).addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const targetElement = document.getElementById(targetId);
                        if (isBackground) {
                            targetElement.style.background = `url(${event.target.result})`;
                            targetElement.style.backgroundSize = 'cover';
                            targetElement.style.backgroundPosition = 'center';
                        } else {
                            targetElement.src = event.target.result;
                            targetElement.style.display = 'block';
                        }
                    }
                    reader.readAsDataURL(file);
                }
            });
        }

        handleHeaderUpload('inputBg', 'headerContainer', true);
        handleHeaderUpload('inputLogoKiri', 'logoKiriPreview');
        handleHeaderUpload('inputLogoKanan', 'logoKananPreview');

        function generateGrid() {
            const count = parseInt(document.getElementById('gridSelector').value);
            const uploadContainer = document.getElementById('dynamicUploadContainer');
            const gridPreview = document.getElementById('gridContainerPreview');
            
            uploadContainer.innerHTML = '';
            gridPreview.innerHTML = '';

            if (count === 1) {
                gridPreview.style.gridTemplateColumns = '1fr';
            } else {
                gridPreview.style.gridTemplateColumns = '1fr 1fr'; 
            }

            for (let i = 1; i <= count; i++) {
                // Inisialisasi memori jika belum ada
                if (!photoState[i]) {
                    photoState[i] = { src: '', posX: 50, posY: 50, mode: 'cover' };
                }

                const state = photoState[i];

                // Buat Panel Kontrol di Sidebar
                const uploadDiv = document.createElement('div');
                uploadDiv.className = 'dynamic-photo-input';
                uploadDiv.innerHTML = `
                    <label style="color:#0f172a; font-size:14px;">📸 Foto Kegiatan #${i}</label>
                    <input type="file" accept="image/*" id="inputFoto${i}" style="margin-bottom:8px;">
                    
                    <div class="control-row">
                        <div class="control-col">
                            <label class="sub-label">Geser Atas/Bawah: <span id="valPosY${i}" class="val-display">${state.posY}</span>%</label>
                            <input type="range" class="slider" min="0" max="100" value="${state.posY}" id="posY${i}">
                        </div>
                        <div class="control-col">
                            <label class="sub-label">Geser Kiri/Kanan: <span id="valPosX${i}" class="val-display">${state.posX}</span>%</label>
                            <input type="range" class="slider" min="0" max="100" value="${state.posX}" id="posX${i}">
                        </div>
                    </div>

                    <select id="modeFoto${i}" style="font-size:12px; padding:6px; margin-top:2px;">
                        <option value="cover" ${state.mode === 'cover' ? 'selected' : ''}>Mode: Potong Penuh Kotak (Cover)</option>
                        <option value="contain" ${state.mode === 'contain' ? 'selected' : ''}>Mode: Tampilkan Utuh Tanpa Potong (Contain)</option>
                    </select>
                `;
                uploadContainer.appendChild(uploadDiv);

                // Buat Kotak Foto di Kertas Laporan (Menggunakan Tag <img> Asli)
                const photoBox = document.createElement('div');
                photoBox.className = 'photo-box';
                photoBox.id = `boxFoto${i}`;
                
                if (count === 3 && i === 1) {
                    photoBox.style.gridColumn = '1 / span 2'; 
                    photoBox.style.aspectRatio = '21/9'; 
                }

                const placeholder = document.createElement('span');
                placeholder.className = 'photo-placeholder';
                placeholder.id = `placeholder${i}`;
                placeholder.innerText = `Foto Kegiatan ${i}`;

                const imgElement = document.createElement('img');
                imgElement.id = `imgFoto${i}`;

                photoBox.appendChild(placeholder);
                photoBox.appendChild(imgElement);
                gridPreview.appendChild(photoBox);

                // Pulihkan foto jika sebelumnya sudah pernah diupload
                if (state.src) {
                    applyPhotoToBox(i);
                }

                // Event Listener Upload Foto
                document.getElementById(`inputFoto${i}`).addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            photoState[i].src = event.target.result;
                            applyPhotoToBox(i);
                        }
                        reader.readAsDataURL(file);
                    }
                });

                // Event Listener Geser Vertikal (Atas/Bawah)
                document.getElementById(`posY${i}`).addEventListener('input', function(e) {
                    photoState[i].posY = e.target.value;
                    document.getElementById(`valPosY${i}`).innerText = e.target.value;
                    applyPhotoToBox(i);
                });

                // Event Listener Geser Horizontal (Kiri/Kanan)
                document.getElementById(`posX${i}`).addEventListener('input', function(e) {
                    photoState[i].posX = e.target.value;
                    document.getElementById(`valPosX${i}`).innerText = e.target.value;
                    applyPhotoToBox(i);
                });

                // Event Listener Mode Cover/Contain
                document.getElementById(`modeFoto${i}`).addEventListener('change', function(e) {
                    photoState[i].mode = e.target.value;
                    applyPhotoToBox(i);
                });
            }
        }

        function applyPhotoToBox(index) {
            const state = photoState[index];
            const img = document.getElementById(`imgFoto${index}`);
            const placeholder = document.getElementById(`placeholder${index}`);
            const box = document.getElementById(`boxFoto${index}`);

            if (state.src) {
                img.src = state.src;
                img.style.display = 'block';
                img.style.objectFit = state.mode;
                img.style.objectPosition = `${state.posX}% ${state.posY}%`;
                placeholder.style.display = 'none';
                box.style.backgroundColor = state.mode === 'contain' ? '#0f172a' : '#334155';
            }
        }

        // Jalankan saat pertama kali dibuka
        generateGrid();

        // Fungsi Unduh Anti-Terpotong di HP
        function downloadReport() {
            const btn = document.getElementById('btnDownload');
            const originalText = btn.innerText;
            btn.innerText = '⏳ Sedang Memproses Gambar...';
            btn.disabled = true;

            const reportArea = document.getElementById('reportArea');
            
            html2canvas(reportArea, { 
                scale: 2,
                useCORS: true,
                scrollX: 0,
                scrollY: 0,
                windowWidth: 1200 // Memaksa render ukuran desktop agar tidak gepeng di HP
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Dokumentasi-Slogdam-Grid.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.92);
                link.click();
                
                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                alert('Gagal mengunduh gambar. Silakan coba lagi.');
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
